services:
  app:
    build: .
    image: url-shortener
    container_name: url-shortener
    ports:
      - "8000:8000"
    environment:
      SHORT_URLS_STORAGE_FILEPATH: /data/short-urls.json
      REDIS_HOST: redis
    volumes:
      # Хранилище коротких ссылок сохраняется на хосте в ./data/short-urls.json
      - ./data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: url-shortener-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: