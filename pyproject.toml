[project]
name = "fastapi-url-shortener"
version = "0.1.0"
description = "FASTApi URL shortener"
readme = "README.md"
authors = [
    { name = "Esther", email = "ctroika95@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[project.scripts]
fastapi-url-shortener = "fastapi_url_shortener:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
